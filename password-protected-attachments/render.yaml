services:
  - type: web
    name: rossum-password-protected-pdf-unlocker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ROSSUM_WEBHOOK_SECRET
        sync: false
      - key: LOG_LEVEL
        value: INFO
